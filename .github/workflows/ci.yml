name: MarketUZ CI

on:
  push:
    branches: [main, 'security/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: marketuz
          POSTGRES_PASSWORD: marketuz_ci_password
          POSTGRES_DB: marketuz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Run unit and PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgresql://marketuz:marketuz_ci_password@127.0.0.1:5432/marketuz_test
        run: npm test
